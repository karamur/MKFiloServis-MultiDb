# ============================================================
# 🧪 Tests — Build & Test
# ------------------------------------------------------------
# GitHub Actions Linux runner
# - PR ve main push üzerinde çalışır
# - xUnit testleri zorunlu olarak çalışır; TRX sonuçları saklanır
# ============================================================
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟣 Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: 📦 Restore dependencies
        run: dotnet restore MKFiloServis.Web/MKFiloServis.Web.csproj

      - name: 🔨 Build (no restore)
        run: |
          dotnet build MKFiloServis.Web/MKFiloServis.Web.csproj \
            --configuration Release \
            --no-restore \
            /p:ContinuousIntegrationBuild=true

      - name: Build test project
        run: |
          dotnet restore MKFiloServis.Tests/MKFiloServis.Tests.csproj
          dotnet build MKFiloServis.Tests/MKFiloServis.Tests.csproj --configuration Release --no-restore

      - name: 🧪 Run tests
        run: |
          dotnet test MKFiloServis.Tests/MKFiloServis.Tests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./TestResults

      - name: 📋 Publish test results
        if: always() && hashFiles('TestResults/**/test-results.trx') != ''
        uses: dorny/test-reporter@v2
        with:
          name: xUnit Test Results
          path: "TestResults/**/test-results.trx"
          reporter: dotnet-trx
          fail-on-error: false

      - name: 📦 Upload test results
        if: always() && hashFiles('TestResults/**/test-results.trx') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/**/test-results.trx
          retention-days: 14

      - name: ❌ Fail if build or tests failed
        if: failure()
        run: |
          echo "::error::Build veya testler basarisiz oldu. Ayrinti icin job ozetine bakin."
          exit 1


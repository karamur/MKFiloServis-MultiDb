<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="title description">
  <title id="title">MKFiloServis — Filo, kiralama ve servis yönetimi</title>
  <desc id="description">Lacivert zemin üzerinde turkuaz çizgilerle çizilmiş bir filo aracı ve rota noktaları.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1" gradientUnits="objectBoundingBox">

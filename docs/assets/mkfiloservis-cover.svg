    <circle cx="935" cy="207" r="146" fill="#102541" fill-opacity=".78" stroke="#7dd3fc" stroke-opacity=".3" stroke-width="2"/>
    <circle cx="935" cy="207" r="126" fill="none" stroke="#7dd3fc" stroke-opacity=".2" stroke-dasharray="3 9"/>

    <g fill="none" stroke="#7dd3fc" stroke-width="2" stroke-opacity=".65">
      <path d="M706 285h66l31-30M1037 171l37-36h71"/>
      <circle cx="702" cy="285" r="4" fill="#102541"/>

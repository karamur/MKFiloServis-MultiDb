    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a6c5ed" stroke-opacity=".14"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="400" rx="24"/></clipPath>
  </defs>


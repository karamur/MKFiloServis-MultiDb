      <path d="M812 232v-16q0-14 15-19l18-6 25-39q9-14 26-14h78q17 0 28 14l29 39 19 6q15 5 15 19v16q0 13-13 13h-19m-52 0h-86m-52 0h-18q-13 0-13-13Z"/>
      <path d="M855 191h174m-101-52v52m-100 25h16m190 0h16" fill="none"/>
